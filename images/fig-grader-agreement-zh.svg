<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">評分器要先和人工標註比對</title>
<desc id="d">上方左邊是兩位專家互相比對的一致率，當作基準；右邊是評分器和專家的一致率。下方三種情況：評分器與專家的一致率接近專家之間，算達到基準；專家彼此一致但評分器不一致，回頭修評分準則；專家彼此就不一致，重新想要量的是什麼。一致率要扣除碰巧一致的部分，例如用 Cohen's kappa。</desc>
<rect width="1600" height="900" fill="#fbfaf7"/>
<rect x="100" y="70" width="620" height="300" rx="18" fill="#f3f6f4" stroke="#9aa7ad" stroke-width="2"/>
<circle cx="250" cy="200" r="58" fill="#3d6b8c" stroke="#1d2a33" stroke-width="2"/><text x="250" y="210" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">專家 A</text>
<circle cx="570" cy="200" r="58" fill="#3d6b8c" stroke="#1d2a33" stroke-width="2"/><text x="570" y="210" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">專家 B</text>
<line x1="310" y1="200" x2="510" y2="200" stroke="#1d2a33" stroke-width="3" stroke-dasharray="8 6"/>
<text x="410" y="330" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="26" fill="#1d2a33" font-weight="400" text-anchor="middle">專家之間的一致率（基準）</text>
<rect x="880" y="70" width="620" height="300" rx="18" fill="#f3f6f4" stroke="#9aa7ad" stroke-width="2"/>
<circle cx="1030" cy="200" r="58" fill="#0b5c51" stroke="#1d2a33" stroke-width="2"/><text x="1030" y="210" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">評分器</text>
<circle cx="1350" cy="200" r="58" fill="#3d6b8c" stroke="#1d2a33" stroke-width="2"/><text x="1350" y="210" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">專家</text>
<line x1="1090" y1="200" x2="1290" y2="200" stroke="#1d2a33" stroke-width="3" stroke-dasharray="8 6"/>
<text x="1190" y="330" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="26" fill="#1d2a33" font-weight="400" text-anchor="middle">評分器與專家的一致率</text>
<text x="800" y="230" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="30" fill="#55626b" font-weight="700" text-anchor="middle">比較</text>
<rect x="100" y="420" width="1400" height="110" rx="18" fill="#ffffff" stroke="#9aa7ad" stroke-width="2"/>
<rect x="100" y="420" width="14" height="110" rx="4" fill="#0b5c51"/>
<text x="150" y="466" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="28" fill="#1d2a33" font-weight="400" text-anchor="start">評分器與專家的一致率</text>
<text x="150" y="506" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="28" fill="#1d2a33" font-weight="400" text-anchor="start">接近專家之間</text>
<text x="1460" y="487" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="30" fill="#0b5c51" font-weight="700" text-anchor="end">達到基準</text>
<rect x="100" y="545" width="1400" height="110" rx="18" fill="#ffffff" stroke="#9aa7ad" stroke-width="2"/>
<rect x="100" y="545" width="14" height="110" rx="4" fill="#b4532a"/>
<text x="150" y="591" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="28" fill="#1d2a33" font-weight="400" text-anchor="start">專家彼此一致，</text>
<text x="150" y="631" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="28" fill="#1d2a33" font-weight="400" text-anchor="start">評分器卻不一致</text>
<text x="1460" y="612" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="30" fill="#b4532a" font-weight="700" text-anchor="end">回頭修評分準則</text>
<rect x="100" y="670" width="1400" height="110" rx="18" fill="#ffffff" stroke="#9aa7ad" stroke-width="2"/>
<rect x="100" y="670" width="14" height="110" rx="4" fill="#b4532a"/>
<text x="150" y="737" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="28" fill="#1d2a33" font-weight="400" text-anchor="start">專家彼此就不一致</text>
<text x="1460" y="737" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="30" fill="#b4532a" font-weight="700" text-anchor="end">重新想要量的是什麼</text>
<text x="800" y="818" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#55626b" font-weight="400" text-anchor="middle">一致率要扣除碰巧一致的部分，</text>
<text x="800" y="852" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#55626b" font-weight="400" text-anchor="middle">例如用 Cohen's kappa</text>
</svg>
